name: Feature request
description: Propose a framework or plugin improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: Describe the legitimate use case without including real target data.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Core CLI
        - Plugin lifecycle
        - Batch workflows
        - Reporting
        - Documentation
        - New plugin
        - Installation
    validations:
      required: true
  - type: textarea
    id: upstream
    attributes:
      label: Upstream project and license
      description: Required for new-tool proposals.
