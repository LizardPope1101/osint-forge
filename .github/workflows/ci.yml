name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} and plugin contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python
        run: python -m py_compile forge/osint_forge.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate plugin contracts
        run: ./bin/osint forge validate

      - name: Smoke-test catalog
        run: |
          ./bin/osint --version
          ./bin/osint forge list
          ./bin/osint forge categories

  shell:
    name: Shell quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check executable modes
        run: |
          test -x bootstrap.sh
          test -x bin/osint
          test -x forge/osint_forge.py
          test -z "$(find scripts plugins docs/plugin-template -type f \
            -name '*.sh' ! -perm -u+x -print -quit)"

      - name: Check shell syntax
        run: bash -n bootstrap.sh bin/osint scripts/*.sh plugins/*/*.sh docs/plugin-template/*.sh

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: shellcheck -e SC1090,SC2034 bootstrap.sh bin/osint scripts/*.sh plugins/*/*.sh docs/plugin-template/*.sh

  debian:
    name: Debian smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: debian:stable-slim
    steps:
      - name: Install test dependencies
        run: apt-get update && apt-get install -y git python3

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Exercise uninstalled framework
        env:
          OSINT_FORGE_ROOT: ${{ github.workspace }}
          OSINT_FORGE_STATE: /tmp/osint-forge-state
        run: |
          ./bin/osint --version
          ./bin/osint forge validate
          ./bin/osint forge list

      - name: Exercise isolated install and batch integration tests
        env:
          OSINT_FORGE_ROOT: ${{ github.workspace }}
          OSINT_FORGE_STATE: /tmp/osint-forge-state
        run: python3 -m unittest discover -s tests -v
