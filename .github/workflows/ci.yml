name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} and plugin contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python
        run: python -m py_compile forge/osint_forge.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate plugin contracts
        run: ./bin/osint forge validate

      - name: Smoke-test catalog
        run: |
          ./bin/osint --version
          ./bin/osint forge list
          ./bin/osint forge categories

  shell:
    name: Shell quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check executable modes
        run: |
          test -x bootstrap.sh
          test -x bin/osint
          test -x forge/osint_forge.py
          test -z "$(find scripts plugins docs/plugin-template -type f \
            -name '*.sh' ! -perm -u+x -print -quit)"

      - name: Check shell syntax
        run: bash -n bootstrap.sh bin/osint scripts/*.sh plugins/*/*.sh docs/plugin-template/*.sh

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: shellcheck -e SC1090,SC2034 bootstrap.sh bin/osint scripts/*.sh plugins/*/*.sh docs/plugin-template/*.sh

  clean-install:
    name: Clean install (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian stable
            image: debian:stable-slim
          - name: Ubuntu 24.04
            image: ubuntu:24.04
    container: ${{ matrix.image }}
    steps:
      - name: Install checkout dependencies
        run: apt-get update && apt-get install -y ca-certificates git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Bootstrap clean system
        run: ./bootstrap.sh

      - name: Exercise installed framework
        run: |
          osint --version
          osint forge validate
          osint forge list
          osint forge categories

      - name: Exercise upgrade replacement
        run: |
          touch /usr/local/share/osint-forge/stale-release-test
          ./scripts/install-framework.sh
          test ! -e /usr/local/share/osint-forge/stale-release-test
          osint forge validate

      - name: Run integration tests
        env:
          OSINT_FORGE_ROOT: ${{ github.workspace }}
          OSINT_FORGE_STATE: /tmp/osint-forge-state
        run: python3 -m unittest discover -s tests -v

      - name: Exercise plugin lifecycle dry-runs
        env:
          OSINT_FORGE_ROOT: /usr/local/share/osint-forge
          OSINT_FORGE_STATE: /tmp/osint-forge-state
          OSINT_FORGE_DRY_RUN: "1"
        run: |
          for plugin in exiftool ghunt maigret nmap recon-ng sherlock spiderfoot; do
            plugin_dir="/usr/local/share/osint-forge/plugins/$plugin"
            export OSINT_FORGE_PLUGIN_ID="$plugin"
            export OSINT_FORGE_PLUGIN_DIR="$plugin_dir"
            "$plugin_dir/install.sh"
            "$plugin_dir/update.sh"
            "$plugin_dir/remove.sh"
          done

      - name: Uninstall without deleting user data
        run: |
          test -f /root/.config/osint-forge/targets.txt
          ./scripts/uninstall-framework.sh
          test ! -e /usr/local/bin/osint
          test ! -e /usr/local/share/osint-forge
          test -f /root/.config/osint-forge/targets.txt
