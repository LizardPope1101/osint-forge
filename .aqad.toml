[project]
name = "osint-forge"
protected_branches = ["main"]
task_sources = ["manual", "roadmap", "github-issues"]
required_documents = ["README.md", "docs/ROADMAP.md", ".github/SECURITY.md"]

[policy]
max_repairs = 4
allow_draft_pr = true
allow_merge = false
allow_release = false

[validation]
gates = [
  "python3 -m compileall -q forge tests",
  "python3 -m unittest discover -s tests -v",
  "bash -n bootstrap.sh",
]
